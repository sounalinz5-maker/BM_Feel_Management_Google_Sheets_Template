name: BM FUEL Android APK Test Build
on:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/bm-fuel-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: android-native
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BM-FUEL-Android-TEST-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
