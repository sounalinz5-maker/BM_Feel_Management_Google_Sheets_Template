name: BM FUEL new PWA sanity tests
on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/bm-fuel-pwa-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app/logic.mjs
          node --check app/demo-data.mjs
          node --check app/app.mjs
          node --check app/sw.js
      - name: Run pure logic test suite
        run: node --test app/tests/logic.test.mjs
      - name: Verify app manifest and PWA assets
        run: |
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('app')
          m=json.loads((root/'manifest.json').read_text())
          assert m['display']=='standalone'
          assert m['start_url']=='./index.html' and m['scope']=='./'
          html=(root/'index.html').read_text()
          assert 'rel="manifest"' in html
          assert 'id="loginScreen"' in html and 'id="meterForm"' in html
          assert 'id="chartPlot"' in html and 'id="enterDemo"' in html
          assert 'id="installEntry"' in html
          assert 'google.script.run' not in html
          for item in m['icons']:
            path=(root/item['src']).resolve()
            assert path.is_file(), str(path)
            data=path.read_bytes()
            assert data[:8]==b'\x89PNG\r\n\x1a\n'
          print('BM FUEL preview PWA manifests and files PASS')
          PY
