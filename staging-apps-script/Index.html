<!doctype html><html lang="th"><head><base target="_top"><style>
*{box-sizing:border-box}body{margin:0;background:#07172b;color:#edf4ff;font:16px system-ui,sans-serif}main{max-width:530px;margin:auto;padding:20px}h1{font-size:23px;margin:0}small{color:#ffc57d}section{background:#102d4a;border:1px solid #395b7c;border-radius:14px;padding:16px;margin:14px 0}label{display:block;font-weight:600;margin:14px 0 6px}input,select{width:100%;color:#fff;background:#081e35;border:1px solid #6c88a3;border-radius:9px;padding:12px;font:inherit}input[readonly]{color:#b5c9dd}input[type=checkbox]{width:auto}button{border:0;background:#ffad58;color:#12253a;font:inherit;font-weight:bold;border-radius:10px;padding:13px;width:100%;cursor:pointer}button:disabled{opacity:.45;cursor:default}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{background:#233e5a;color:#dbe9f6;border:1px solid #5b7792}.grid button[aria-pressed=true]{background:#ffad58;color:#102234;border-color:#ffad58}.summary{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.line{display:flex;justify-content:space-between;border-top:1px solid #385673;padding:9px 0;font-size:14px}.muted{color:#b7cce1;font-size:13px}#status{white-space:pre-wrap;overflow-wrap:anywhere}#calc{font-size:24px;font-weight:bold;color:#a3e6bf;margin-top:10px}#reload{background:#284764;color:white;margin-top:10px}[hidden]{display:none!important}
</style></head><body><main><h1>⛽ BM FUEL STAGING</h1><small>เปิด–ปิดมิเตอร์รายวัน · ข้อมูลทดสอบเท่านั้น</small>
<section id="status" role="status" aria-live="polite">กำลังเชื่อมต่อ…</section><section><label for="day">วันที่</label><input type="date" id="day" required><label>รอบบันทึก</label><div class="grid"><button id="morning" type="button" aria-pressed="true">☀ เปิดตอนเช้า</button><button id="evening" type="button" aria-pressed="false">☾ ปิดตอนเย็น</button></div>
<label for="nozzle">เลือกหัวจ่าย</label><select id="nozzle"></select>
<form id="form"><div id="openingBox" hidden><label for="opening">มิเตอร์เปิด (บันทึกแล้ว)</label><input id="opening" readonly></div><label id="valueLabel" for="value">เลขมิเตอร์เปิด</label><input id="value" inputmode="decimal" required pattern="[0-9]{1,10}([.][0-9]{1,3})?" placeholder="0.000" autocomplete="off"><div id="calc" hidden></div><p class="muted" id="hint"></p><label><input type="checkbox" id="confirm" required> ยืนยันข้อมูลทดสอบ ไม่ใช่ยอดขายจริง</label><button id="save" disabled>บันทึกมิเตอร์เปิด</button></form><button id="reload" type="button">โหลดข้อมูลล่าสุด</button></section>
<section><strong>ความคืบหน้าของวันที่เลือก</strong><p class="summary"><span id="opened">เปิด —/6</span><span id="closed">ปิด —/6</span></p><div id="progress"></div><p><strong>ยอดรวมเฉพาะหัวที่ปิดแล้ว: <span id="total">—</span> ลิตร</strong></p></section><p class="muted">ไม่ใช้ Railway · ไม่แนบรูป · ไม่เก็บรหัสผ่าน</p></main><script>
const el=id=>document.getElementById(id),day=el('day'),nozzle=el('nozzle'),value=el('value'),save=el('save'),status=el('status');let phase='open',busy=false,state=null,serial=0;
const fmt=n=>n===null?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3});
day.value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Vientiane',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const names=n=>'หัว '+n+' · '+(n<=3?'ดีเซล':'เบนซิน');
for(let i=1;i<=6;i++)nozzle.add(new Option(names(i),String(i)));
function selected(){return state?.records.find(r=>r.nozzle===Number(nozzle.value));}
function update(){
  const r=selected(),closing=phase==='close',allowed=!!r&&(closing?r.state==='open':r.state==='empty');
  el('morning').setAttribute('aria-pressed',String(!closing));el('evening').setAttribute('aria-pressed',String(closing));
  [day,nozzle,el('morning'),el('evening'),el('reload')].forEach(x=>x.disabled=busy);
  el('openingBox').hidden=!closing;el('opening').value=r?.opening!=null?fmt(r.opening):'ยังไม่บันทึก';
  el('valueLabel').textContent=closing?'เลขมิเตอร์ปิด':'เลขมิเตอร์เปิด';
  value.disabled=busy||!allowed;el('confirm').disabled=busy||!allowed;
  save.disabled=busy||!allowed;save.textContent=closing?'บันทึกมิเตอร์ปิด':'บันทึกมิเตอร์เปิด';
  el('hint').textContent=!r?'โหลดข้อมูลก่อนบันทึก':r.state==='closed'?'ปิดมิเตอร์แล้ว · ขาย '+fmt(r.liters)+' ลิตร':closing?(allowed?'เลขเปิดดึงจากข้อมูลที่บันทึกไว้':'ต้องบันทึกเลขเปิดก่อน'):(allowed?'บันทึกเลขเปิดเพียงครั้งเดียว':'บันทึกเลขเปิดแล้ว '+fmt(r.opening));
  el('calc').hidden=!closing||!allowed||!value.value||!value.validity.valid||Number(value.value)<r?.opening;
  if(!el('calc').hidden)el('calc').textContent=fmt((Math.round(Number(value.value)*1000)-Math.round(r.opening*1000))/1000)+' ลิตร';
  el('opened').textContent='เปิด '+(state?.opened??'—')+'/6';el('closed').textContent='ปิด '+(state?.closed??'—')+'/6';el('total').textContent=state?fmt(state.total):'—';
  el('progress').replaceChildren();
  if(state)for(const x of state.records){const line=document.createElement('div');line.className='line';const a=document.createElement('span'),b=document.createElement('span');a.textContent=names(x.nozzle);b.textContent=x.state==='closed'?'ปิดแล้ว ✓':x.state==='open'?'เปิดแล้ว · รอปิด':'ยังไม่เปิด';line.append(a,b);el('progress').append(line);}
}
function clear(){value.value='';el('confirm').checked=false;}
function load(){if(busy)return;const ticket=++serial;state=null;busy=true;clear();update();status.textContent='กำลังโหลดข้อมูล…';google.script.run.withSuccessHandler(r=>{if(ticket!==serial)return;busy=false;state=r?.ok&&r.source==='APPS_SCRIPT_STAGING_SAMPLE'?r:null;status.textContent=state?'เชื่อม Google Sheets STAGING สำเร็จ':'ยังไม่ยืนยันการเชื่อมต่อ';update();}).withFailureHandler(e=>{if(ticket!==serial)return;busy=false;state=null;status.textContent='โหลดไม่ได้: '+(e.message||e);update();}).getDay(day.value);}
day.addEventListener('change',load);nozzle.addEventListener('change',()=>{clear();update();});value.addEventListener('input',update);
el('morning').onclick=()=>{phase='open';clear();update();};el('evening').onclick=()=>{phase='close';clear();update();};el('reload').onclick=load;
el('form').addEventListener('submit',e=>{e.preventDefault();if(busy||save.disabled||!el('form').reportValidity())return;const payload={date:day.value,nozzle:Number(nozzle.value),phase,value:value.value,confirmSample:el('confirm').checked};busy=true;update();status.textContent='กำลังบันทึกและอ่านกลับ…';google.script.run.withSuccessHandler(r=>{busy=false;state=r?.persisted===true&&r.source==='APPS_SCRIPT_STAGING_SAMPLE'?r:null;status.textContent=state?'บันทึก '+names(payload.nozzle)+' สำเร็จ · '+(payload.phase==='open'?'เปิดมิเตอร์':'ปิดมิเตอร์'):'ยังไม่ยืนยันการบันทึก โปรดโหลดข้อมูลล่าสุด';clear();update();}).withFailureHandler(err=>{busy=false;state=null;status.textContent='บันทึกไม่สำเร็จ: '+(err.message||err)+' · กดโหลดข้อมูลล่าสุดก่อนลองใหม่';update();}).saveMeter(payload);});
load();
</script></body></html>
