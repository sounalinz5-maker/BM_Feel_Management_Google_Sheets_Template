<!doctype html><html lang="th"><head><base target="_top"><style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#07172b;color:#e8f0fa;margin:0}main{max-width:590px;margin:auto;padding:20px}h1{font-size:24px;margin-bottom:6px}small{color:#ffc57d}section,fieldset{background:#102d4a;border:1px solid #426281;border-radius:13px;padding:12px;margin:12px 0}legend{font-weight:bold}label{display:block}input{background:#081e35;border:1px solid #587997;border-radius:7px;color:white;padding:10px;font:inherit;width:100%}input[type=checkbox]{width:auto} .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{font:inherit;background:#ffa54e;color:#07172b;font-weight:bold;border:0;border-radius:9px;padding:13px;width:100%}button:disabled{opacity:.5}p{line-height:1.5}output{display:block;color:#b7d7ef;margin-top:8px}#status{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body><main><h1>⛽ BM FUEL STAGING</h1><small>Google Apps Script · Google Sheets · ข้อมูลทดสอบเท่านั้น</small><section id="status" role="status">กำลังตรวจสอบการเชื่อมต่อ…</section><form id="meters"><label>วันที่ทดสอบ<input id="day" type="date" required></label><div id="rows"></div><p><label><input id="confirm" type="checkbox" required> ยืนยันว่าเป็นข้อมูลทดสอบ ไม่ใช่ยอดขายจริง</label></p><button id="save" disabled>บันทึกทั้ง 6 หัวจ่าย</button></form><p>ไม่ใช้ Railway · ไม่แนบรูป · ไม่เก็บรหัสผ่าน</p></main><script>
const el=id=>document.getElementById(id),form=el('meters'),save=el('save'),status=el('status');let connected=false,busy=false;
const now=new Date();el('day').value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Vientiane',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);
for(let i=1;i<=6;i++){const f=document.createElement('fieldset');f.innerHTML='<legend>หัว '+i+' · '+(i<=3?'ดีเซล':'เบนซิน')+'</legend><div class="grid"><label>มิเตอร์เปิด<input id="o'+i+'" required inputmode="decimal" pattern="[0-9]{1,10}([.][0-9]{1,3})?" placeholder="0.000"></label><label>มิเตอร์ปิด<input id="c'+i+'" required inputmode="decimal" pattern="[0-9]{1,10}([.][0-9]{1,3})?" placeholder="0.000"></label></div><output id="v'+i+'">— ลิตร</output>';el('rows').appendChild(f);f.addEventListener('input',()=>{const a=el('o'+i).value,b=el('c'+i).value;el('v'+i).textContent=a&&b&&Number(b)>=Number(a)?(Number(b)-Number(a)).toFixed(3)+' ลิตร':'— ลิตร';});}
function fail(e){busy=false;save.disabled=!connected;status.textContent='ไม่สำเร็จ: '+(e.message||String(e));}
google.script.run.withSuccessHandler(r=>{connected=r.ok===true&&r.source==='APPS_SCRIPT_STAGING_SAMPLE';save.disabled=!connected;status.textContent=connected?'เชื่อม Google Sheets STAGING สำเร็จ':'ยังไม่ได้ยืนยันการเชื่อมต่อ';}).withFailureHandler(fail).getStatus();
form.addEventListener('submit',e=>{e.preventDefault();if(!connected||busy)return;const readings=Array.from({length:6},(_,j)=>({nozzle:j+1,opening:el('o'+(j+1)).value,closing:el('c'+(j+1)).value}));busy=true;save.disabled=true;status.textContent='กำลังบันทึกและตรวจสอบ 6 รายการ…';google.script.run.withSuccessHandler(r=>{busy=false;save.disabled=false;if(r.persisted===true&&r.count===6){status.textContent='บันทึกและอ่านกลับจาก Google Sheets สำเร็จ 6 หัวจ่าย';el('confirm').checked=false;}else{status.textContent='ไม่สามารถยืนยันการบันทึก กรุณาตรวจ Meter_Log';}}).withFailureHandler(fail).saveMeters({date:el('day').value,readings,confirmSample:el('confirm').checked});});
</script></body></html>
